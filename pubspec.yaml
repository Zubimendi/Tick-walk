name: tickwalk
description: "Site inspection checklists with photo and GPS evidence that work with no signal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  drift: 2.28.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.8
  intl: ^0.20.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  flutter_image_compress: ^2.4.0
  pdf: ^3.11.1
  share_plus: ^13.3.1
  pocketbase: ^0.26.0
  connectivity_plus: ^7.3.2
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.28.2
  build_runner: ^2.7.2
  mocktail: ^1.0.5

dependency_overrides:
  archive: ^4.0.11

flutter:
  uses-material-design: true
